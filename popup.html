<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SolSniper</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #000; --p: #060606; --p2: #0d0d0d; --l: #1c1c1c; --l2: #2b2b2b;
      --dim: #5c5c5c; --mid: #9a9a9a; --fg: #d9d9d9; --hi: #fff;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: #fff; color: #000; }
    html, body { background: var(--bg); color: var(--fg); }
    body { width: 380px; min-height: 440px; font: 12px/1.45 var(--mono); font-variant-numeric: tabular-nums; padding-bottom: env(safe-area-inset-bottom); -webkit-font-smoothing: antialiased; }
    @media (pointer: coarse) {
      body { width: 100%; }
      input, select, button { font-size: 16px !important; }
      .btn { min-height: 40px; }
    }

    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--p2); border-bottom: 1px solid var(--l); }
    .logo-mark { width: 18px; height: 18px; flex: none; }
    h1 { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 400; }
    .title b { background: var(--hi); color: #000; padding: 1px 5px; font-weight: 600; letter-spacing: .08em; }
    .title span { margin-left: 6px; color: var(--mid); letter-spacing: .3em; }
    h1 .hud { font-size: 9px; letter-spacing: .2em; color: var(--dim); border: 1px solid var(--l2); padding: 0 4px; }
    .ws { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); cursor: pointer; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #000; outline: 1px solid var(--dim); }
    .dot.connected { background: var(--hi); outline: 0; box-shadow: 0 0 6px rgba(255,255,255,.9); }
    .dot.connecting { background: var(--mid); outline: 0; }

    nav { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--l); }
    nav button { position: relative; padding: 9px 0; background: none; border: 0; color: var(--dim); font: 500 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
    nav button:hover { color: var(--fg); }
    nav button.active { color: var(--hi); }
    nav button.active::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: -1px; height: 2px; background: var(--hi); }
    main { padding: 12px; }
    .tab { display: none; flex-direction: column; gap: 10px; }
    .tab.active { display: flex; }

    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { min-width: 0; }
    .grow { flex: 1; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 340px) { .grid2 { grid-template-columns: 1fr; } }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 9.5px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
    input[type=text], input[type=number], input[type=password], select {
      width: 100%; height: 32px; padding: 0 9px; border-radius: 0;
      background: var(--bg); color: var(--hi); border: 1px solid var(--l2); font: 12px var(--mono); outline: none; letter-spacing: 0; text-transform: none;
    }
    input:focus, select:focus { border-color: var(--hi); }
    input::placeholder { color: #444; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--fg); }
    .toggle { appearance: none; -webkit-appearance: none; width: 36px; height: 20px; background: var(--p2); border: 1px solid var(--l2); position: relative; cursor: pointer; flex: none; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; background: var(--dim); transition: transform .15s; }
    .toggle:checked { border-color: var(--hi); }
    .toggle:checked::after { transform: translateX(16px); background: var(--hi); }
    .btn {
      padding: 8px 12px; border: 1px solid var(--hi); background: var(--hi); color: #000;
      font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; white-space: nowrap;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: var(--fg); }
    .btn.ghost, .btn.sm { background: transparent; color: var(--fg); border-color: var(--l2); }
    .btn.ghost:hover, .btn.sm:hover { background: var(--hi); color: #000; border-color: var(--hi); }
    .btn.sm { padding: 5px 9px; font-size: 10px; letter-spacing: .1em; font-weight: 500; }
    .hint { font-size: 11px; color: var(--dim); }
    .sec { font-size: 9.5px; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; padding: 6px 0 5px; border-bottom: 1px solid var(--l); }
    .good { color: var(--hi); } .warn { color: var(--mid); } .mute { color: var(--dim); }
    .bad { color: #000; background: var(--hi); padding: 0 4px; font-weight: 600; }
    .hint .bad, .saved.bad { background: none; color: var(--fg); padding: 0; text-decoration: underline; }
    .saved { font-size: 10px; color: var(--hi); letter-spacing: .1em; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }

    .result { border: 1px solid var(--l2); padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--p); }
    .result:empty { display: none; }
    .result b { color: var(--hi); }
    .kvs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--l); border: 1px solid var(--l); }
    .kvs div { display: flex; flex-direction: column; background: var(--bg); padding: 5px 7px; color: var(--hi); }
    .kvs span:first-child { color: var(--dim); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
    .badge { font-weight: 600; font-size: 9.5px; padding: 1px 6px; letter-spacing: .14em; border: 1px solid; }
    .badge.SAFE { color: var(--hi); border-color: var(--hi); }
    .badge.WARNING { color: var(--fg); border-color: var(--mid); border-style: dashed; }
    .badge.DANGER { color: #000; background: var(--hi); border-color: var(--hi); }

    .log { display: flex; flex-direction: column; gap: 1px; background: var(--l); border: 1px solid var(--l); max-height: 380px; overflow-y: auto; }
    .log:has(.empty) { background: none; border: 0; }
    @media (pointer: coarse) { .log { max-height: none; } }
    .sig { padding: 8px 10px; background: var(--p); display: flex; flex-direction: column; gap: 5px; border-left: 2px solid var(--hi); }
    .sig.rej { border-left-color: var(--l2); }
    .sig .top { display: flex; align-items: center; gap: 8px; }
    .sig .sym { font-weight: 600; color: var(--hi); }
    .sig.rej .sym { color: var(--mid); }
    .sig .meta { font-size: 10.5px; color: var(--dim); }
    .sig .meta.bad { background: none; color: var(--mid); padding: 0; font-weight: 400; }
    .sig .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .empty { text-align: center; color: var(--dim); padding: 24px 0; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <svg class="logo-mark" viewBox="60 60 392 392" aria-hidden="true"><circle cx="256" cy="256" r="146" fill="none" stroke="#fff" stroke-width="26" stroke-dasharray="185.3 44" stroke-dashoffset="-22"/><path d="M256 84V164M256 348V428M84 256H164M348 256H428" stroke="#fff" stroke-width="18"/><rect x="232" y="232" width="48" height="48" fill="#fff" transform="rotate(45 256 256)"/></svg>
    <h1><span class="title"><b>SOL</b><span>SNIPER</span></span><span class="hud">HUD</span></h1>
    <span class="ws" id="wsStatus" title="Нажмите для переподключения"><span class="dot" id="wsDot"></span><span id="wsText">WS…</span></span>
  </header>

  <nav>
    <button data-tab="scan" class="active">Скан</button>
    <button data-tab="filters">Фильтры</button>
    <button data-tab="signals">Сигналы <span id="sigCount" class="mute"></span></button>
  </nav>

  <main>
    <!-- SCAN -->
    <section class="tab active" id="tab-scan">
      <button class="btn" id="scanTab">Сканировать текущую вкладку</button>
      <div class="hint" id="scanTabMsg"></div>
      <div class="sec">Ручная проверка CA</div>
      <div class="row">
        <input type="text" id="caInput" class="grow mono" placeholder="Mint / pair address" autocomplete="off" spellcheck="false">
        <button class="btn" id="caCheck">Check</button>
      </div>
      <div class="result" id="caResult"></div>
    </section>

    <!-- FILTERS -->
    <section class="tab" id="tab-filters">
      <div class="switch"><span>Авто-проверка при открытии вкладки</span><input type="checkbox" class="toggle" data-k="autoCheck"></div>
      <div class="switch"><span>Push-уведомления о сигналах</span><input type="checkbox" class="toggle" data-k="notifyEnabled"></div>
      <div class="sec">Жёсткий фильтр сигналов</div>
      <div class="grid2">
        <label class="f">Max Top 10 holders, %<input type="number" data-k="maxTop10Pct" min="1" max="100" step="1"></label>
        <label class="f">Min Volume 5m, $<input type="number" data-k="minVol5mUsd" min="0" step="1000"></label>
        <label class="f">Min Score (0-100)<input type="number" data-k="minScore" min="0" max="100" step="5"></label>
        <label class="f">Риск на сделку, %<input type="number" data-k="riskPct" min="0.1" max="100" step="0.1"></label>
      </div>
      <div class="sec">Тестовый депозит</div>
      <div class="grid2">
        <label class="f">Сумма<input type="number" data-k="depositAmount" min="0" step="any"></label>
        <label class="f">Валюта<select data-k="depositCurrency"><option value="USD">USD</option><option value="SOL">SOL</option></select></label>
        <label class="f">Take Profit, x<input type="number" data-k="tpMultiple" min="1.1" step="0.1"></label>
        <label class="f">Продать на TP, %<input type="number" data-k="tpSellPct" min="1" max="100" step="5"></label>
      </div>
      <div class="sec">Подключения</div>
      <div class="switch"><span>WebSocket сигналы (Telegram-парсер)</span><input type="checkbox" class="toggle" data-k="wsEnabled"></div>
      <label class="f">WebSocket URL<input type="text" class="mono" data-k="wsUrl" placeholder="ws://localhost:8080"></label>
      <label class="f">Helius API key (рекомендуется)<input type="password" class="mono" data-k="heliusApiKey" placeholder="xxxxxxxx-xxxx-…" autocomplete="off"></label>
      <label class="f">Custom RPC URL (опционально)<input type="text" class="mono" data-k="rpcUrl" placeholder="https://…"></label>
      <div class="row"><span class="hint grow" id="rpcInfo"></span><span class="saved" id="savedMark">✓ сохранено</span></div>
    </section>

    <!-- SIGNALS -->
    <section class="tab" id="tab-signals">
      <div class="row">
        <div class="switch grow"><span>Показать отклонённые</span><input type="checkbox" class="toggle" id="showRejected"></div>
        <button class="btn ghost sm" id="clearLog">Очистить</button>
      </div>
      <div class="row">
        <input type="text" id="testCa" class="grow mono" placeholder="CA для тестового сигнала" autocomplete="off" spellcheck="false">
        <button class="btn sm" id="testSignal">Test</button>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
