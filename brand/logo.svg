<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset=".55" stop-color="#0b0d18"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#14F195" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B26BFF"/>
      <stop offset=".5" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="tick" gradientUnits="userSpaceOnUse" x1="76" y1="76" x2="436" y2="436">
      <stop offset="0" stop-color="#E9DDFF"/>
      <stop offset="1" stop-color="#B9FFE6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#7CFFD0"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14F195" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#7B5CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="tile" x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

  <!-- reticle ring with cardinal gaps -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="185.3 44" stroke-dashoffset="-22" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>

  <!-- cross ticks -->
  <g stroke="url(#tick)" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="76"  x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="436"/>
    <line x1="76"  y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="436" y2="256"/>
  </g>

  <!-- core crystal -->
  <g filter="url(#glow)">
    <path d="M256 204 L300 256 L256 308 L212 256 Z" fill="url(#core)"/>
  </g>
  <path d="M256 204 L300 256 L256 256 Z" fill="#fff" fill-opacity=".35"/>
</svg>
